<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embeddable Vectoroscope</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08080b;
        --panel: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.11);
        --text: #f1f1ec;
        --muted: #979792;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent 26%),
          linear-gradient(145deg, #0a0a0c 0%, #101015 52%, #08080b 100%);
        color: var(--text);
        font-family: "SFMono-Regular", "Menlo", "Monaco", "Consolas", monospace;
      }

      .embed-shell {
        width: min(100vw, 980px);
        margin: 0 auto;
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .track-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .track-button {
        min-height: 48px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        padding: 0 12px;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      }

      .track-button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.26);
      }

      .track-button.is-active {
        background: linear-gradient(135deg, rgba(241, 241, 236, 0.2), rgba(188, 188, 178, 0.1));
        border-color: rgba(241, 241, 236, 0.42);
      }

      .stage {
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01)),
          #09090c;
      }

      .canvas-frame {
        width: 100%;
        aspect-ratio: 1 / 1;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .meta {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.85rem;
      }

      .status {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .time {
        color: var(--text);
      }

      audio {
        display: none;
      }

      @media (max-width: 640px) {
        .embed-shell {
          padding: 12px;
        }

        .track-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="embed-shell">
      <div class="track-list" id="track-list"></div>

      <div class="stage">
        <div class="canvas-frame">
          <canvas id="visualizer-canvas" width="1600" height="1600"></canvas>
        </div>
        <div class="meta">
          <div class="status" id="status-text">Choose a track.</div>
          <div class="time" id="time-text">00:00 / 00:00</div>
        </div>
      </div>

      <audio id="audio-player" preload="metadata" crossorigin="anonymous"></audio>
    </div>

    <script>
      const EMBED_TRACKS = [
        {
          title: "Dichotomy",
          word: "DICHOTOMY",
          src: "https://res.cloudinary.com/dxqdhd3ec/video/upload/v1777865192/Dichotomy_cxauj8.wav",
        },
        { title: "Track Two", word: "TRACK TWO", src: "./track-2.mp3" },
        { title: "Track Three", word: "TRACK THREE", src: "./track-3.mp3" },
      ];

      const VISUALIZER_CONFIG = {
        radiusScale: 1.58,
        offsetX: 0,
        offsetY: 0.04,
        wordScale: 1.5,
        pointSizeBase: 2.15,
        pointSizeEnergyBoost: 0.45,
      };

      const canvas = document.getElementById("visualizer-canvas");
      const ctx = canvas.getContext("2d");
      const audioPlayer = document.getElementById("audio-player");
      const trackList = document.getElementById("track-list");
      const statusText = document.getElementById("status-text");
      const timeText = document.getElementById("time-text");

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const textCanvas = document.createElement("canvas");
      const textCtx = textCanvas.getContext("2d", { willReadFrequently: true });

      const state = {
        activeIndex: -1,
        isRendering: false,
        rafId: 0,
        lastRenderTime: 0,
        audioBuffer: null,
        wordPoints: [],
        analyserNode: null,
        audioSourceNode: null,
        frequencyData: null,
      };

      const PREVIEW_FRAME_INTERVAL = 1000 / 30;

      function setStatus(message) {
        statusText.textContent = message;
      }

      function formatTime(totalSeconds) {
        if (!Number.isFinite(totalSeconds)) {
          return "00:00";
        }
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = Math.floor(totalSeconds % 60);
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function resizeCanvases() {
        const size = 1600;
        canvas.width = size;
        canvas.height = size;
        textCanvas.width = size;
        textCanvas.height = size;
      }

      function ensureAudioGraph() {
        if (state.audioSourceNode && state.analyserNode) {
          return;
        }

        const source = audioContext.createMediaElementSource(audioPlayer);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0.84;
        source.connect(audioContext.destination);
        source.connect(analyser);

        state.audioSourceNode = source;
        state.analyserNode = analyser;
        state.frequencyData = new Uint8Array(analyser.frequencyBinCount);
      }

      function averageRange(data, start, end) {
        let total = 0;
        let count = 0;
        for (let index = start; index < end; index += 1) {
          total += data[index];
          count += 1;
        }
        return count ? total / count / 255 : 0;
      }

      function sampleAudioBands() {
        if (!state.analyserNode || !state.frequencyData) {
          return { bass: 0, mid: 0, high: 0 };
        }

        state.analyserNode.getByteFrequencyData(state.frequencyData);
        const total = state.frequencyData.length;
        return {
          bass: averageRange(state.frequencyData, 2, Math.max(18, Math.floor(total * 0.025))),
          mid: averageRange(
            state.frequencyData,
            Math.max(18, Math.floor(total * 0.025)),
            Math.max(120, Math.floor(total * 0.18)),
          ),
          high: averageRange(
            state.frequencyData,
            Math.max(120, Math.floor(total * 0.18)),
            Math.max(420, Math.floor(total * 0.46)),
          ),
        };
      }

      function decodeTrack(url) {
        return fetch(url, { mode: "cors" })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`Failed to load ${url}`);
            }
            return response.arrayBuffer();
          })
          .then((buffer) => audioContext.decodeAudioData(buffer.slice(0)));
      }

      function waitForMediaReady() {
        return new Promise((resolve, reject) => {
          const onReady = () => {
            cleanup();
            resolve();
          };
          const onError = () => {
            cleanup();
            reject(new Error("Audio element could not load this file."));
          };
          const cleanup = () => {
            audioPlayer.removeEventListener("canplay", onReady);
            audioPlayer.removeEventListener("loadeddata", onReady);
            audioPlayer.removeEventListener("error", onError);
          };

          audioPlayer.addEventListener("canplay", onReady, { once: true });
          audioPlayer.addEventListener("loadeddata", onReady, { once: true });
          audioPlayer.addEventListener("error", onError, { once: true });
          audioPlayer.load();
        });
      }

      function filledAt(imageData, width, height, x, y) {
        if (x < 0 || x >= width || y < 0 || y >= height) {
          return false;
        }
        const index = (Math.floor(y) * width + Math.floor(x)) * 4;
        const red = imageData[index];
        const green = imageData[index + 1];
        const blue = imageData[index + 2];
        const alpha = imageData[index + 3];
        return alpha > 20 && (red + green + blue) / 3 > 40;
      }

      function sampleWordPoints(word, spacing = 12) {
        textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
        textCtx.fillStyle = "#000";
        textCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);
        textCtx.textAlign = "center";
        textCtx.textBaseline = "middle";
        textCtx.lineJoin = "round";
        textCtx.lineCap = "round";

        let size = Math.min(300, textCanvas.width * 0.28);
        const displayWord = word.trim().toUpperCase();
        while (size > 52) {
          textCtx.font = `700 ${size}px Georgia`;
          const glyphWidths = [...displayWord].map((char) => textCtx.measureText(char).width);
          const totalWidth =
            glyphWidths.reduce((sum, width) => sum + width, 0) +
            Math.max(0, displayWord.length - 1) * spacing;
          if (totalWidth <= textCanvas.width * 0.76) {
            break;
          }
          size -= 8;
        }

        textCtx.lineWidth = Math.max(18, size * 0.09);
        textCtx.strokeStyle = "#fff";
        textCtx.fillStyle = "#fff";
        textCtx.font = `700 ${size}px Georgia`;

        const glyphWidths = [...displayWord].map((char) => textCtx.measureText(char).width);
        const totalWidth =
          glyphWidths.reduce((sum, width) => sum + width, 0) +
          Math.max(0, displayWord.length - 1) * spacing;
        let cursor = textCanvas.width / 2 - totalWidth / 2;
        [...displayWord].forEach((char, index) => {
          const charWidth = glyphWidths[index];
          const centerX = cursor + charWidth / 2;
          textCtx.strokeText(char, centerX, textCanvas.height * 0.56);
          textCtx.fillText(char, centerX, textCanvas.height * 0.56);
          cursor += charWidth + spacing;
        });

        const imageData = textCtx.getImageData(0, 0, textCanvas.width, textCanvas.height).data;
        const points = [];
        const step = displayWord.length >= 10 ? 4 : displayWord.length >= 6 ? 5 : 6;
        const neighborStride = Math.max(2, Math.floor(step * 0.75));

        for (let y = 0; y < textCanvas.height; y += step) {
          for (let x = 0; x < textCanvas.width; x += step) {
            if (!filledAt(imageData, textCanvas.width, textCanvas.height, x, y)) {
              continue;
            }

            let filledNeighbors = 0;
            const neighbors = [
              [x - neighborStride, y],
              [x + neighborStride, y],
              [x, y - neighborStride],
              [x, y + neighborStride],
              [x - neighborStride, y - neighborStride],
              [x + neighborStride, y - neighborStride],
              [x - neighborStride, y + neighborStride],
              [x + neighborStride, y + neighborStride],
            ];
            neighbors.forEach(([nx, ny]) => {
              if (filledAt(imageData, textCanvas.width, textCanvas.height, nx, ny)) {
                filledNeighbors += 1;
              }
            });

            points.push({
              left: ((x / textCanvas.width) * 2 - 1) * VISUALIZER_CONFIG.wordScale,
              right: ((y / textCanvas.height) * 2 - 1) * VISUALIZER_CONFIG.wordScale * -1,
              coreStrength: filledNeighbors / neighbors.length,
            });
          }
        }

        return points;
      }

      function morphPoints(trackWordPoints, audioPoints, bands) {
        return audioPoints.map((point, index) => {
          const wordPoint = trackWordPoints[index % trackWordPoints.length];
          const normalizedX = (wordPoint.left / VISUALIZER_CONFIG.wordScale + 1) / 2;
          const leftWeight = Math.max(0, 1 - normalizedX * 2);
          const rightWeight = Math.max(0, normalizedX * 2 - 1);
          const midWeight = Math.max(0, 1 - Math.abs(normalizedX - 0.5) * 2);
          const bandJump =
            bands.bass * leftWeight * 1.2 +
            bands.mid * midWeight * 1.08 +
            bands.high * rightWeight * 1.55;
          const fringe = 1 - wordPoint.coreStrength;
          const strength = (0.004 + bandJump * 0.12) * (0.2 + fringe * 1.7);
          const directionX = point.left === 0 ? Math.cos(index * 1.7) : Math.sign(point.left);
          const directionY = point.right === 0 ? Math.sin(index * 1.3) : Math.sign(point.right);
          const phase = audioPlayer.currentTime * (1.4 + bandJump * 4.5);

          return {
            left:
              wordPoint.left +
              directionX * strength * 0.34 +
              Math.sin(index * 0.41 + phase) * strength * (0.24 + leftWeight * 0.74 + rightWeight * 0.5),
            right:
              wordPoint.right +
              directionY * strength * 0.34 +
              Math.cos(index * 0.37 + phase) * strength * (0.22 + midWeight * 0.88 + fringe * 0.44),
            coreStrength: wordPoint.coreStrength,
          };
        });
      }

      function getVectorSnapshot() {
        if (!state.audioBuffer || state.wordPoints.length === 0) {
          return { points: [], energy: 0 };
        }

        const density = 3600;
        const leftChannel = state.audioBuffer.getChannelData(0);
        const rightChannel =
          state.audioBuffer.numberOfChannels > 1
            ? state.audioBuffer.getChannelData(1)
            : leftChannel;
        const currentTime = audioPlayer.currentTime || 0;
        const centerSample = Math.floor(currentTime * state.audioBuffer.sampleRate);
        const halfWindow = density * 2;
        const start = Math.max(0, centerSample - halfWindow);
        const end = Math.min(leftChannel.length - 1, start + density * 4);
        const step = Math.max(1, Math.floor((end - start) / density));
        const audioPoints = [];
        let energyAccumulator = 0;

        for (let sampleIndex = start; sampleIndex < end; sampleIndex += step) {
          const left = leftChannel[sampleIndex] || 0;
          const right = rightChannel[sampleIndex] || 0;
          audioPoints.push({ left, right });
          energyAccumulator += Math.abs(left) + Math.abs(right);
        }

        const energy = audioPoints.length
          ? Math.min(1, energyAccumulator / (audioPoints.length * 1.4))
          : 0;
        return {
          points: morphPoints(state.wordPoints, audioPoints, sampleAudioBands()),
          energy,
        };
      }

      function drawScene(snapshot) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, "#0e0e12");
        gradient.addColorStop(1, "#09090c");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const points = snapshot.points;
        if (points.length === 0) {
          return;
        }

        const centerX = canvas.width * (0.5 + VISUALIZER_CONFIG.offsetX);
        const centerY = canvas.height * (0.5 + VISUALIZER_CONFIG.offsetY);
        const radius = Math.min(canvas.width, canvas.height) * 0.39 * VISUALIZER_CONFIG.radiusScale;

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.shadowBlur = 14;
        ctx.shadowColor = "rgba(241, 241, 236, 0.3)";
        ctx.fillStyle = `rgba(241, 241, 236, ${0.58 + snapshot.energy * 0.18})`;

        for (let index = 0; index < points.length; index += 1) {
          const point = points[index];
          const size =
            VISUALIZER_CONFIG.pointSizeBase +
            point.coreStrength * 1.45 +
            snapshot.energy * (VISUALIZER_CONFIG.pointSizeEnergyBoost + (1 - point.coreStrength) * 0.45);
          ctx.beginPath();
          ctx.arc(point.left * radius, -point.right * radius, size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function renderFrame(timestamp = 0) {
        if (state.isRendering && timestamp - state.lastRenderTime < PREVIEW_FRAME_INTERVAL) {
          state.rafId = requestAnimationFrame(renderFrame);
          return;
        }

        state.lastRenderTime = timestamp;
        const snapshot = getVectorSnapshot();
        drawScene(snapshot);
        timeText.textContent = `${formatTime(audioPlayer.currentTime)} / ${formatTime(audioPlayer.duration)}`;

        if (state.isRendering) {
          state.rafId = requestAnimationFrame(renderFrame);
        }
      }

      function startRendering() {
        if (state.isRendering) {
          return;
        }
        state.isRendering = true;
        renderFrame();
      }

      function stopRendering() {
        state.isRendering = false;
        state.lastRenderTime = 0;
        if (state.rafId) {
          cancelAnimationFrame(state.rafId);
          state.rafId = 0;
        }
      }

      function updateButtons() {
        trackList.querySelectorAll(".track-button").forEach((button, index) => {
          button.classList.toggle("is-active", index === state.activeIndex);
        });
      }

      async function selectTrack(track, index) {
        try {
          await audioContext.resume();
          ensureAudioGraph();

          const resolvedUrl = new URL(track.src, window.location.href).href;

          if (audioPlayer.src !== resolvedUrl) {
            setStatus(`Loading ${track.title}...`);
            audioPlayer.pause();
            audioPlayer.src = resolvedUrl;
            const decodePromise = decodeTrack(resolvedUrl);
            await waitForMediaReady();
            state.audioBuffer = await decodePromise;
            state.wordPoints = sampleWordPoints(track.word || track.title);
          }

          state.activeIndex = index;
          updateButtons();
          await audioPlayer.play();
          startRendering();
          setStatus(`Playing ${track.title}`);
        } catch (error) {
          console.error(error);
          setStatus(
            "Audio could not be loaded. On GitHub Pages, use real file URLs in this repo or another public host.",
          );
        }
      }

      function buildButtons() {
        EMBED_TRACKS.forEach((track, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "track-button";
          button.textContent = track.title;
          button.addEventListener("click", async () => {
            if (state.activeIndex === index && !audioPlayer.paused) {
              audioPlayer.pause();
              return;
            }

            if (state.activeIndex === index && audioPlayer.paused) {
              try {
                await audioContext.resume();
                await audioPlayer.play();
                startRendering();
                setStatus(`Playing ${track.title}`);
              } catch (error) {
                console.error(error);
                setStatus("Playback could not resume.");
              }
              return;
            }

            selectTrack(track, index);
          });
          trackList.appendChild(button);
        });
      }

      audioPlayer.addEventListener("pause", () => {
        if (!audioPlayer.ended) {
          stopRendering();
          renderFrame();
          setStatus("Paused.");
        }
      });

      audioPlayer.addEventListener("play", () => {
        startRendering();
      });

      audioPlayer.addEventListener("ended", () => {
        stopRendering();
        renderFrame();
        setStatus("Choose a track.");
      });

      resizeCanvases();
      buildButtons();
      renderFrame();
    </script>
  </body>
</html>
