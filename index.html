<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embeddable Vectoroscope</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f6f2e6;
        --border: rgba(10, 12, 18, 0.18);
        --text: #0a0d15;
        --muted: rgba(10, 12, 18, 0.58);
        --button-bg: rgba(255, 255, 255, 0.24);
        --button-active: rgba(10, 12, 18, 0.06);
        --scope: #4a5d23;
        --scope-glow: rgba(74, 93, 35, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1710.08px;
        height: 851.7px;
        min-height: 851.7px;
        overflow: hidden;
        background: var(--page);
        color: var(--text);
        font-family: "Times New Roman", "Iowan Old Style", "Georgia", serif;
      }

      body {
        min-height: 851.7px;
      }

      .embed-shell {
        width: 1710.08px;
        height: 851.7px;
        display: grid;
        grid-template-rows: minmax(0, 1fr) 66px;
        background: var(--page);
        overflow: hidden;
      }

      .stage {
        position: relative;
        min-height: 0;
        background: var(--page);
      }

      .canvas-frame {
        width: 100%;
        height: 100%;
        min-height: 100%;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: var(--page);
      }

      .track-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 1px solid var(--border);
        background: var(--page);
      }

      .track-button {
        min-height: 66px;
        border: 0;
        border-right: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: clamp(1.4rem, 2.2vw, 2.4rem);
        line-height: 1;
        cursor: pointer;
        padding: 10px 16px 12px;
        transition: background 140ms ease, color 140ms ease, opacity 140ms ease;
      }

      .track-button:last-child {
        border-right: 0;
      }

      .track-button:hover {
        background: var(--button-bg);
      }

      .track-button.is-active {
        background: var(--button-active);
      }

      .track-button.is-idle {
        opacity: 0.9;
      }

      audio {
        display: none;
      }

      @media (max-width: 700px) {
        html,
        body,
        .embed-shell {
          width: 100%;
          height: 100vh;
          min-height: 100vh;
        }

        .embed-shell {
          grid-template-rows: minmax(0, 1fr) auto;
        }

        .track-list {
          grid-template-columns: 1fr;
        }

        .track-button {
          min-height: 58px;
          font-size: 1.25rem;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .track-button:last-child {
          border-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="embed-shell">
      <section class="stage">
        <div class="canvas-frame">
          <canvas id="visualizer-canvas" width="1600" height="1200"></canvas>
        </div>
      </section>

      <nav class="track-list" id="track-list"></nav>

      <audio id="audio-player" preload="metadata" crossorigin="anonymous"></audio>
    </div>

    <script>
      const EMBED_TRACKS = [
        {
          title: "Dichotomy",
          word: "DICHOTOMY",
          src: "https://res.cloudinary.com/dxqdhd3ec/video/upload/v1777865192/Dichotomy_cxauj8.wav",
        },
        {
          title: "Auspicious",
          word: "AUSPICIOUS",
          src: "https://res.cloudinary.com/dxqdhd3ec/video/upload/v1777867487/big_song_final_lmxlwg.wav",
        },
        {
          title: "Snail Race",
          word: "SNAIL RACE",
          src: "https://res.cloudinary.com/dxqdhd3ec/video/upload/v1777867439/Felix_Seren_Hugo_-_Snail_Race_Completed_Real_Final_aylzls.wav",
        },
      ];

      const VISUALIZER_CONFIG = {
        radiusScale: 4.72,
        offsetX: 0,
        offsetY: 0.34,
        wordScale: 1.02,
        pointSizeBase: 1.72,
        pointSizeEnergyBoost: 0.3,
        pointCount: 3024,
        textSpacing: 14,
        textVerticalNudge: -88,
      };

      const canvas = document.getElementById("visualizer-canvas");
      const ctx = canvas.getContext("2d");
      const audioPlayer = document.getElementById("audio-player");
      const trackList = document.getElementById("track-list");

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const textCanvas = document.createElement("canvas");
      const textCtx = textCanvas.getContext("2d", { willReadFrequently: true });

      const state = {
        activeIndex: -1,
        isRendering: false,
        rafId: 0,
        lastRenderTime: 0,
        audioBuffer: null,
        wordPoints: [],
        analyserNode: null,
        audioSourceNode: null,
        frequencyData: null,
      };

      const PREVIEW_FRAME_INTERVAL = 1000 / 30;

      function resizeCanvases() {
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(1200, Math.round(rect.width * window.devicePixelRatio || 1));
        const height = Math.max(900, Math.round(rect.height * window.devicePixelRatio || 1));
        canvas.width = width;
        canvas.height = height;
        textCanvas.width = 1600;
        textCanvas.height = 1200;
      }

      function ensureAudioGraph() {
        if (state.audioSourceNode && state.analyserNode) {
          return;
        }

        const source = audioContext.createMediaElementSource(audioPlayer);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0.84;
        source.connect(audioContext.destination);
        source.connect(analyser);

        state.audioSourceNode = source;
        state.analyserNode = analyser;
        state.frequencyData = new Uint8Array(analyser.frequencyBinCount);
      }

      function averageRange(data, start, end) {
        let total = 0;
        let count = 0;
        for (let index = start; index < end; index += 1) {
          total += data[index];
          count += 1;
        }
        return count ? total / count / 255 : 0;
      }

      function sampleAudioBands() {
        if (!state.analyserNode || !state.frequencyData) {
          return { bass: 0, mid: 0, high: 0 };
        }

        state.analyserNode.getByteFrequencyData(state.frequencyData);
        const total = state.frequencyData.length;
        return {
          bass: averageRange(state.frequencyData, 2, Math.max(18, Math.floor(total * 0.025))),
          mid: averageRange(
            state.frequencyData,
            Math.max(18, Math.floor(total * 0.025)),
            Math.max(120, Math.floor(total * 0.18)),
          ),
          high: averageRange(
            state.frequencyData,
            Math.max(120, Math.floor(total * 0.18)),
            Math.max(420, Math.floor(total * 0.46)),
          ),
        };
      }

      function decodeTrack(url) {
        return fetch(url, { mode: "cors" })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`Failed to load ${url}`);
            }
            return response.arrayBuffer();
          })
          .then((buffer) => audioContext.decodeAudioData(buffer.slice(0)));
      }

      function waitForMediaReady() {
        return new Promise((resolve, reject) => {
          const onReady = () => {
            cleanup();
            resolve();
          };
          const onError = () => {
            cleanup();
            reject(new Error("Audio element could not load this file."));
          };
          const cleanup = () => {
            audioPlayer.removeEventListener("canplay", onReady);
            audioPlayer.removeEventListener("loadeddata", onReady);
            audioPlayer.removeEventListener("error", onError);
          };

          audioPlayer.addEventListener("canplay", onReady, { once: true });
          audioPlayer.addEventListener("loadeddata", onReady, { once: true });
          audioPlayer.addEventListener("error", onError, { once: true });
          audioPlayer.load();
        });
      }

      function filledAt(imageData, width, height, x, y) {
        if (x < 0 || x >= width || y < 0 || y >= height) {
          return false;
        }
        const index = (Math.floor(y) * width + Math.floor(x)) * 4;
        const red = imageData[index];
        const green = imageData[index + 1];
        const blue = imageData[index + 2];
        const alpha = imageData[index + 3];
        return alpha > 20 && (red + green + blue) / 3 > 40;
      }

      function buildGlyphMetrics(displayWord, size, spacing) {
        textCtx.font = `700 ${size}px Georgia`;
        const glyphs = [...displayWord].map((char) => {
          const metrics = textCtx.measureText(char);
          return {
            char,
            width: metrics.width,
            ascent: metrics.actualBoundingBoxAscent || size * 0.72,
            descent: metrics.actualBoundingBoxDescent || size * 0.2,
          };
        });
        const totalWidth =
          glyphs.reduce((sum, glyph) => sum + glyph.width, 0) +
          Math.max(0, glyphs.length - 1) * spacing;
        const maxAscent = Math.max(...glyphs.map((glyph) => glyph.ascent));
        const maxDescent = Math.max(...glyphs.map((glyph) => glyph.descent));
        return { glyphs, totalWidth, maxAscent, maxDescent };
      }

      function sampleWordPoints(word, spacing = VISUALIZER_CONFIG.textSpacing) {
        textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
        textCtx.fillStyle = "#000";
        textCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);
        textCtx.textAlign = "left";
        textCtx.textBaseline = "alphabetic";
        textCtx.lineJoin = "round";
        textCtx.lineCap = "round";

        const displayWord = word.trim().toUpperCase();
        let size = Math.min(220, textCanvas.width * 0.16);
        let metrics = buildGlyphMetrics(displayWord, size, spacing);

        while (
          size > 34 &&
          (metrics.totalWidth > textCanvas.width * 0.68 ||
            metrics.maxAscent + metrics.maxDescent > textCanvas.height * 0.24)
        ) {
          size -= 6;
          metrics = buildGlyphMetrics(displayWord, size, spacing);
        }

        textCtx.lineWidth = Math.max(18, size * 0.09);
        textCtx.strokeStyle = "#fff";
        textCtx.fillStyle = "#fff";
        textCtx.font = `700 ${size}px Georgia`;

        const startX = (textCanvas.width - metrics.totalWidth) * 0.5;
        const baselineY =
          textCanvas.height * 0.37 +
          (metrics.maxAscent - metrics.maxDescent) * 0.5 +
          VISUALIZER_CONFIG.textVerticalNudge;

        const bottomEdge = baselineY + metrics.maxDescent + textCtx.lineWidth;
        const safeBottom = textCanvas.height * 0.42;
        const adjustedBaselineY =
          bottomEdge > safeBottom ? baselineY - (bottomEdge - safeBottom) : baselineY;

        let cursor = startX;
        metrics.glyphs.forEach((glyph, index) => {
          textCtx.strokeText(glyph.char, cursor, adjustedBaselineY);
          textCtx.fillText(glyph.char, cursor, adjustedBaselineY);
          cursor += glyph.width + (index < metrics.glyphs.length - 1 ? spacing : 0);
        });

        const imageData = textCtx.getImageData(0, 0, textCanvas.width, textCanvas.height).data;

        function collectPoints(step) {
          const points = [];
          const neighborStride = Math.max(2, Math.floor(step * 0.75));

          for (let y = 0; y < textCanvas.height; y += step) {
            for (let x = 0; x < textCanvas.width; x += step) {
              if (!filledAt(imageData, textCanvas.width, textCanvas.height, x, y)) {
                continue;
              }

              let filledNeighbors = 0;
              const neighbors = [
                [x - neighborStride, y],
                [x + neighborStride, y],
                [x, y - neighborStride],
                [x, y + neighborStride],
                [x - neighborStride, y - neighborStride],
                [x + neighborStride, y - neighborStride],
                [x - neighborStride, y + neighborStride],
                [x + neighborStride, y + neighborStride],
              ];
              neighbors.forEach(([nx, ny]) => {
                if (filledAt(imageData, textCanvas.width, textCanvas.height, nx, ny)) {
                  filledNeighbors += 1;
                }
              });

              points.push({
                left: ((x / textCanvas.width) * 2 - 1) * VISUALIZER_CONFIG.wordScale,
                right: ((y / textCanvas.height) * 2 - 1) * VISUALIZER_CONFIG.wordScale * -1,
                coreStrength: filledNeighbors / neighbors.length,
              });
            }
          }

          return points;
        }

        let step = displayWord.length >= 10 ? 4 : displayWord.length >= 6 ? 5 : 6;
        let points = collectPoints(step);
        const minimumPoints = Math.max(VISUALIZER_CONFIG.pointCount, 5200);

        while (points.length < minimumPoints && step > 2) {
          step -= 1;
          points = collectPoints(step);
        }

        if (points.length < minimumPoints && points.length > 0) {
          const densified = [];
          const copiesNeeded = Math.ceil(minimumPoints / points.length);
          for (let copy = 0; copy < copiesNeeded; copy += 1) {
            for (let index = 0; index < points.length; index += 1) {
              const point = points[index];
              densified.push({
                left: point.left + ((copy % 3) - 1) * 0.0024,
                right: point.right + ((Math.floor(copy / 3) % 3) - 1) * 0.0024,
                coreStrength: point.coreStrength,
              });
            }
          }
          points = densified.slice(0, minimumPoints);
        }

        return points;
      }

      function morphPoints(trackWordPoints, audioPoints, bands) {
        return audioPoints.map((point, index) => {
          const wordPoint = trackWordPoints[index % trackWordPoints.length];
          const normalizedX = (wordPoint.left / VISUALIZER_CONFIG.wordScale + 1) / 2;
          const leftWeight = Math.max(0, 1 - normalizedX * 2);
          const rightWeight = Math.max(0, normalizedX * 2 - 1);
          const midWeight = Math.max(0, 1 - Math.abs(normalizedX - 0.5) * 2);
          const bandJump =
            bands.bass * leftWeight * 1.2 +
            bands.mid * midWeight * 1.08 +
            bands.high * rightWeight * 1.55;
          const fringe = 1 - wordPoint.coreStrength;
          const strength = (0.004 + bandJump * 0.12) * (0.2 + fringe * 1.7);
          const directionX = point.left === 0 ? Math.cos(index * 1.7) : Math.sign(point.left);
          const directionY = point.right === 0 ? Math.sin(index * 1.3) : Math.sign(point.right);
          const phase = audioPlayer.currentTime * (1.4 + bandJump * 4.5);

          return {
            left:
              wordPoint.left +
              directionX * strength * 0.34 +
              Math.sin(index * 0.41 + phase) * strength * (0.24 + leftWeight * 0.74 + rightWeight * 0.5),
            right:
              wordPoint.right +
              directionY * strength * 0.34 +
              Math.cos(index * 0.37 + phase) * strength * (0.22 + midWeight * 0.88 + fringe * 0.44),
            coreStrength: wordPoint.coreStrength,
          };
        });
      }

      function getVectorSnapshot() {
        if (!state.audioBuffer || state.wordPoints.length === 0) {
          return { points: [], energy: 0 };
        }

        const density = Math.max(VISUALIZER_CONFIG.pointCount, state.wordPoints.length);
        const leftChannel = state.audioBuffer.getChannelData(0);
        const rightChannel =
          state.audioBuffer.numberOfChannels > 1
            ? state.audioBuffer.getChannelData(1)
            : leftChannel;
        const currentTime = audioPlayer.currentTime || 0;
        const centerSample = Math.floor(currentTime * state.audioBuffer.sampleRate);
        const halfWindow = density * 2;
        const start = Math.max(0, centerSample - halfWindow);
        const end = Math.min(leftChannel.length - 1, start + density * 4);
        const step = Math.max(1, Math.floor((end - start) / density));
        const audioPoints = [];
        let energyAccumulator = 0;

        for (let sampleIndex = start; sampleIndex < end; sampleIndex += step) {
          const left = leftChannel[sampleIndex] || 0;
          const right = rightChannel[sampleIndex] || 0;
          audioPoints.push({ left, right });
          energyAccumulator += Math.abs(left) + Math.abs(right);
        }

        const energy = audioPoints.length
          ? Math.min(1, energyAccumulator / (audioPoints.length * 1.4))
          : 0;
        return {
          points: morphPoints(state.wordPoints, audioPoints, sampleAudioBands()),
          energy,
        };
      }

      function drawIdleScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--page").trim();
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawScene(snapshot) {
        drawIdleScene();

        const points = snapshot.points;
        if (points.length === 0) {
          return;
        }

        const centerX = canvas.width * (0.5 + VISUALIZER_CONFIG.offsetX);
        const centerY = canvas.height * (0.45 + VISUALIZER_CONFIG.offsetY);
        const radius = Math.min(canvas.width, canvas.height) * 0.08 * VISUALIZER_CONFIG.radiusScale;

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.shadowBlur = 18;
        ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue("--scope-glow").trim();
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--scope").trim();

        for (let index = 0; index < points.length; index += 1) {
          const point = points[index];
          const size =
            VISUALIZER_CONFIG.pointSizeBase +
            point.coreStrength * 1.15 +
            snapshot.energy * (VISUALIZER_CONFIG.pointSizeEnergyBoost + (1 - point.coreStrength) * 0.42);
          ctx.beginPath();
          ctx.arc(point.left * radius, -point.right * radius, size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function renderFrame(timestamp = 0) {
        if (state.isRendering && timestamp - state.lastRenderTime < PREVIEW_FRAME_INTERVAL) {
          state.rafId = requestAnimationFrame(renderFrame);
          return;
        }

        state.lastRenderTime = timestamp;
        if (state.activeIndex === -1 || !state.audioBuffer) {
          drawIdleScene();
        } else {
          const snapshot = getVectorSnapshot();
          drawScene(snapshot);
        }

        if (state.isRendering) {
          state.rafId = requestAnimationFrame(renderFrame);
        }
      }

      function startRendering() {
        if (state.isRendering) {
          return;
        }
        state.isRendering = true;
        renderFrame();
      }

      function stopRendering() {
        state.isRendering = false;
        state.lastRenderTime = 0;
        if (state.rafId) {
          cancelAnimationFrame(state.rafId);
          state.rafId = 0;
        }
      }

      function updateButtons() {
        trackList.querySelectorAll(".track-button").forEach((button, index) => {
          button.classList.toggle("is-active", index === state.activeIndex);
          button.classList.toggle("is-idle", state.activeIndex === -1);
        });
      }

      async function selectTrack(track, index) {
        try {
          await audioContext.resume();
          ensureAudioGraph();

          const resolvedUrl = new URL(track.src, window.location.href).href;
          const isSameTrack = audioPlayer.src === resolvedUrl;

          audioPlayer.pause();

          if (!isSameTrack) {
            audioPlayer.currentTime = 0;
            audioPlayer.src = resolvedUrl;
            const decodePromise = decodeTrack(resolvedUrl);
            await waitForMediaReady();
            state.audioBuffer = await decodePromise;
            state.wordPoints = sampleWordPoints(track.word || track.title);
          }

          state.activeIndex = index;
          updateButtons();
          audioPlayer.currentTime = 0;
          await audioPlayer.play();
          startRendering();
        } catch (error) {
          console.error(error);
        }
      }

      function buildButtons() {
        EMBED_TRACKS.forEach((track, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "track-button is-idle";
          button.textContent = track.title;
          button.addEventListener("click", async () => {
            await selectTrack(track, index);
          });
          trackList.appendChild(button);
        });
      }

      audioPlayer.addEventListener("pause", () => {
        if (!audioPlayer.ended) {
          stopRendering();
          renderFrame();
        }
      });

      audioPlayer.addEventListener("play", () => {
        startRendering();
      });

      audioPlayer.addEventListener("ended", () => {
        stopRendering();
        renderFrame();
      });

      window.addEventListener("resize", () => {
        resizeCanvases();
        renderFrame();
      });

      resizeCanvases();
      buildButtons();
      drawIdleScene();
    </script>
  </body>
</html>
